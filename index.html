<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>マイ勉強Wiki</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#16181d;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:14px 16px;z-index:2}h1{font-size:20px;margin:0}.wrap{max-width:760px;margin:auto;padding:16px 16px 90px}.toolbar{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}button,.btn{border:0;border-radius:10px;padding:11px 14px;background:#1267e8;color:white;font-weight:700;cursor:pointer}.secondary{background:#e8edf5;color:#222}.danger{background:#ffe7e7;color:#9b111e}.card{background:white;border:1px solid #e2e4e8;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 2px #0000000a}.card h3{margin:0 0 7px}.meta{font-size:12px;color:#6b7280}.tags span{display:inline-block;background:#eef4ff;color:#195ab5;border-radius:999px;padding:4px 8px;margin:4px 4px 0 0;font-size:12px}.search,input,textarea,select{width:100%;padding:12px;border:1px solid #d7dae0;border-radius:10px;background:white;font:inherit}.search{margin-top:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.cat{padding:18px 12px;text-align:center;background:white;border:1px solid #e2e4e8;border-radius:14px;font-weight:700}.empty{text-align:center;color:#777;padding:42px 10px}.modal{display:none;position:fixed;inset:0;background:#0007;z-index:5;align-items:flex-end}.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.sheet h2{margin-top:0}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.preview{max-width:100%;max-height:260px;border-radius:10px;margin-top:8px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:3}.bottom button{width:min(728px,100%);font-size:16px}a{color:#1267e8}.content{white-space:pre-wrap;line-height:1.65}.back{background:none;color:#1267e8;padding:0;margin-bottom:12px}
</style></head><body><header><h1>📚 マイ勉強Wiki</h1><input id='search' class='search' placeholder='ページを検索…'></header><main class='wrap' id='app'></main><div class='bottom'><button onclick='openEditor()'>＋ ページを追加</button></div>
<div class='modal' id='modal'><div class='sheet'><h2 id='editorTitle'>ページを追加</h2><div class='field'><label>タイトル</label><input id='title' placeholder='例：CVケーブル'></div><div class='field'><label>カテゴリ</label><input id='category' placeholder='例：電線・ケーブル'></div><div class='field'><label>本文</label><textarea id='body' rows='8' placeholder='ChatGPTで勉強した内容などを貼り付け'></textarea></div><div class='field'><label>タグ（カンマ区切り）</label><input id='tags' placeholder='試験頻出,重要'></div><div class='field'><label>画像</label><input id='image' type='file' accept='image/*'><img id='preview' class='preview' style='display:none'></div><div class='field'><label>関連ページ（タイトルをカンマ区切り）</label><input id='related' placeholder='VVFケーブル,VVRケーブル'></div><div class='toolbar'><button onclick='savePage()'>保存</button><button class='secondary' onclick='closeEditor()'>キャンセル</button></div></div></div>
<script>
const DB_NAME='studyWikiDB', STORE='pages', DB_VER=1;
const app=document.getElementById('app');
const searchEl=document.getElementById('search');
const modalEl=document.getElementById('modal');
const titleEl=document.getElementById('title');
const categoryEl=document.getElementById('category');
const bodyEl=document.getElementById('body');
const tagsEl=document.getElementById('tags');
const imageEl=document.getElementById('image');
const previewEl=document.getElementById('preview');
const relatedEl=document.getElementById('related');
let pages=[]; let editing=null, imageData='';

function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'id'})};
    req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);
  });
}
async function loadPages(){
  const db=await openDB();
  pages=await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly');const r=tx.objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)});
  pages.sort((a,b)=>(b.updated||0)-(a.updated||0));
}
async function putPage(obj){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(obj);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function deletePageDB(id){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}

async function migrateOld(){
  try{
    const old=JSON.parse(localStorage.getItem('studyWikiPagesV1')||'[]');
    if(Array.isArray(old)&&old.length){
      for(const p of old) await putPage(p);
      localStorage.removeItem('studyWikiPagesV1');
    }
  }catch(e){}
}

function home(q=''){
  const f=pages.filter(p=>(p.title+' '+p.category+' '+p.body+' '+(p.tags||[]).join(' ')).toLowerCase().includes(q.toLowerCase()));
  const cats=[...new Set(f.map(p=>p.category||'未分類'))];
  app.innerHTML=`<div class='meta'>${pages.length}ページ保存中（この端末のブラウザ内）</div>${cats.length?`<h2>カテゴリ</h2><div class='grid'>${cats.map(c=>`<div class='cat' onclick='categoryView(${JSON.stringify(c)})'>${esc(c)}<div class='meta'>${f.filter(p=>(p.category||'未分類')===c).length}ページ</div></div>`).join('')}</div><h2>ページ</h2>${f.map(card).join('')}`:`<div class='empty'>まだページがないで。<br>下の「＋ページを追加」から始めよ。</div>`}`;
}
function card(p){return `<div class='card' onclick='viewPage(${JSON.stringify(p.id)})'><h3>${esc(p.title)}</h3><div class='meta'>${esc(p.category||'未分類')}</div><div class='tags'>${(p.tags||[]).map(t=>`<span>${esc(t)}</span>`).join('')}</div></div>`}
function categoryView(c){const f=pages.filter(p=>(p.category||'未分類')===c);app.innerHTML=`<button class='back' onclick='home()'>← 戻る</button><h2>${esc(c)}</h2>${f.map(card).join('')}`}
function viewPage(id){const p=pages.find(x=>x.id===id);if(!p)return;const rel=(p.related||[]).map(r=>pages.find(x=>x.title.trim().toLowerCase()===r.trim().toLowerCase())).filter(Boolean);app.innerHTML=`<button class='back' onclick='home()'>← 戻る</button><div class='card'><div class='meta'>${esc(p.category||'未分類')}</div><h2>${esc(p.title)}</h2><div class='tags'>${(p.tags||[]).map(t=>`<span>${esc(t)}</span>`).join('')}</div>${p.image?`<img class='preview' src='${p.image}'>`:''}<div class='content'>${esc(p.body||'')}</div>${rel.length?`<h3>関連ページ</h3>${rel.map(x=>`<div><a href='#' onclick='event.preventDefault();viewPage(${JSON.stringify(x.id)})'>→ ${esc(x.title)}</a></div>`).join('')}`:''}<div class='toolbar'><button onclick='openEditor(${JSON.stringify(id)})'>編集</button><button class='danger' onclick='removePage(${JSON.stringify(id)})'>削除</button></div></div>`}
function openEditor(id=null){editing=id;const p=pages.find(x=>x.id===id);document.getElementById('editorTitle').textContent=p?'ページを編集':'ページを追加';titleEl.value=p?.title||'';categoryEl.value=p?.category||'';bodyEl.value=p?.body||'';tagsEl.value=(p?.tags||[]).join(',');relatedEl.value=(p?.related||[]).join(',');imageData=p?.image||'';previewEl.src=imageData;previewEl.style.display=imageData?'block':'none';imageEl.value='';modalEl.style.display='flex'}
function closeEditor(){modalEl.style.display='none'}

async function compressImage(file){
  const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=data});
  const MAX=1600; let w=img.width,h=img.height; const scale=Math.min(1,MAX/Math.max(w,h)); w=Math.round(w*scale);h=Math.round(h*scale);
  const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);
  return canvas.toDataURL('image/jpeg',0.82);
}
imageEl.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{imageData=await compressImage(f);previewEl.src=imageData;previewEl.style.display='block'}catch(err){alert('画像を読み込めへんかった。別の画像で試してみて。')}};

async function savePage(){
  if(!titleEl.value.trim())return alert('タイトル入れてな');
  const obj={id:editing||String(Date.now()),title:titleEl.value.trim(),category:categoryEl.value.trim()||'未分類',body:bodyEl.value,tags:tagsEl.value.split(',').map(x=>x.trim()).filter(Boolean),related:relatedEl.value.split(',').map(x=>x.trim()).filter(Boolean),image:imageData,updated:Date.now()};
  try{await putPage(obj);await loadPages();closeEditor();home(searchEl.value)}catch(e){console.error(e);alert('保存に失敗したで。Safariのプライベートブラウズや端末空き容量を確認してみて。')}
}
async function removePage(id){if(confirm('このページ消す？')){await deletePageDB(id);await loadPages();home(searchEl.value)}}
searchEl.oninput=e=>home(e.target.value);modalEl.onclick=e=>{if(e.target===modalEl)closeEditor()};
(async()=>{try{await migrateOld();await loadPages();home()}catch(e){console.error(e);app.innerHTML=`<div class='empty'>このブラウザでは端末保存を使えへんみたい。<br>Safari通常モードで開いてみて。</div>`}})();
</script></body></html>
